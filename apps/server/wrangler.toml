name = "hrady"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Origins allowed to use the API and open sockets: "*" or a comma-separated
# list such as "https://cebollinos11.github.io,http://localhost:5173".
ALLOWED_ORIGINS = "*"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

# SQLite-backed Durable Objects are the only kind available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["EchoRoom"]

# Stage 6: the echo room is replaced by the game room (it never stored anything).
[[migrations]]
tag = "v2"
deleted_classes = ["EchoRoom"]
new_sqlite_classes = ["GameRoom"]

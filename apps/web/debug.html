<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hrady debug</title>
    <link rel="stylesheet" href="/src/debug/debug.css" />
  </head>
  <body>
    <header class="toolbar">
      <strong>Hrady debug</strong>
      <label
        >Players
        <select id="players">
          <option>3</option>
          <option>4</option>
          <option>5</option>
        </select>
      </label>
      <label>Seed <input id="seed" type="number" placeholder="random" /></label>
      <button id="new">New game</button>
      <span class="sep"></span>
      <button id="export" title="Download the game as { config, seed, actions } JSON">
        Export
      </button>
      <label class="button">Import… <input id="import" type="file" accept=".json" hidden /></label>
      <button id="replay" title="Step through the game from its seed">Replay</button>
      <span class="sep"></span>
      <label
        title="Cover the board when the turn passes, so the next player only sees their own shields"
      >
        <input id="curtain-toggle" type="checkbox" checked /> Pass screen
      </label>
      <label><input id="labels" type="checkbox" /> Labels</label>
      <span id="underlay-controls" hidden>
        <label><input id="underlay" type="checkbox" /> Photo</label>
        <input id="underlay-opacity" type="range" min="0.1" max="1" step="0.05" value="0.6" />
      </span>
      <span class="spacer"></span>
      <a href="./">3D view</a>
    </header>
    <main>
      <div class="viewport"><svg id="board"></svg></div>
      <aside class="panel">
        <section id="status"></section>
        <section id="controls"></section>
        <section id="selection"></section>
        <section>
          <h2>Score</h2>
          <table id="scores"></table>
        </section>
        <section class="log-section">
          <h2>Log</h2>
          <ol id="log"></ol>
        </section>
        <p id="message" class="message" hidden></p>
      </aside>
    </main>
    <div id="curtain" class="curtain" hidden>
      <div>
        <p id="curtain-text"></p>
        <button id="reveal">Show board</button>
      </div>
    </div>
    <script type="module" src="/src/debug/main.ts"></script>
  </body>
</html>
